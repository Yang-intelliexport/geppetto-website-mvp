<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件测试</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .loading { display: flex; align-items: center; justify-content: center; min-height: 200px; }
        .login-form { max-width: 400px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: linear-gradient(90deg, #7F00FF, #00BFFF); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        function LoginForm({ currentLang = 'zh' }) {
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');
            const [messageType, setMessageType] = useState('');
            const [email, setEmail] = useState('');
            
            const texts = {
                zh: {
                    emailLabel: '邮箱地址',
                    emailPlaceholder: 'your.email@company.com',
                    sendButton: '发送登录链接',
                    sending: '发送中...',
                    emailRequired: '请输入邮箱地址',
                    successMessage: '登录链接已发送到您的邮箱！请检查您的邮件（包括垃圾邮件文件夹）。',
                    errorMessage: '发送失败，请稍后重试',
                    securityNote: '我们使用安全的无密码登录方式',
                    instruction: '点击邮件中的链接即可安全登录'
                }
            };
            
            const t = texts[currentLang];
            
            const handleSubmit = async (event) => {
                event.preventDefault();
                
                if (!email.trim()) {
                    setMessage(t.emailRequired);
                    setMessageType('error');
                    return;
                }
                
                setLoading(true);
                setMessage('');
                setMessageType('');
                
                // 模拟发送请求
                setTimeout(() => {
                    setMessage(t.successMessage);
                    setMessageType('success');
                    setLoading(false);
                }, 1500);
            };
            
            return (
                <div className="login-form">
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label htmlFor="email">{t.emailLabel}</label>
                            <input
                                type="email"
                                id="email"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                required
                                placeholder={t.emailPlaceholder}
                            />
                        </div>
                        
                        <button
                            type="submit"
                            disabled={loading}
                            className="btn"
                            style={{width: '100%'}}
                        >
                            {loading ? t.sending : t.sendButton}
                        </button>
                        
                        {message && (
                            <div className={`message ${messageType}`}>
                                {message}
                            </div>
                        )}
                    </form>
                    
                    <div style={{marginTop: '15px', fontSize: '12px', color: '#666', textAlign: 'center'}}>
                        <p>{t.securityNote}</p>
                        <p>{t.instruction}</p>
                    </div>
                </div>
            );
        }
        
        function QuoteCreationFlow({ language = 'zh' }) {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            
            const text = {
                zh: {
                    loading: '正在加载...',
                    step1Title: '第一步：验证您的邮箱',
                    step1Desc: '请输入您的邮箱以接收一个安全的登录/注册链接。',
                    step2Title: '第二步：提交您的报价详情'
                }
            };
            
            const t = text[language];
            
            React.useEffect(() => {
                // 模拟加载过程
                const timer = setTimeout(() => {
                    setLoading(false);
                }, 2000);
                
                return () => clearTimeout(timer);
            }, []);
            
            if (loading) {
                return (
                    <div className="loading">
                        <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                            <div style={{
                                width: '20px', 
                                height: '20px', 
                                border: '2px solid #f3f3f3',
                                borderTop: '2px solid #7F00FF',
                                borderRadius: '50%',
                                animation: 'spin 1s linear infinite'
                            }}></div>
                            <span>{t.loading}</span>
                        </div>
                    </div>
                );
            }
            
            if (!user) {
                return (
                    <div style={{maxWidth: '500px', margin: '0 auto'}}>
                        <div style={{textAlign: 'center', marginBottom: '30px'}}>
                            <h2 style={{fontSize: '24px', fontWeight: 'bold', marginBottom: '10px'}}>{t.step1Title}</h2>
                            <p style={{color: '#666'}}>{t.step1Desc}</p>
                        </div>
                        <LoginForm currentLang={language} />
                    </div>
                );
            }
            
            return (
                <div style={{maxWidth: '800px', margin: '0 auto'}}>
                    <div style={{textAlign: 'center', marginBottom: '30px'}}>
                        <h2 style={{fontSize: '24px', fontWeight: 'bold'}}>{t.step2Title}</h2>
                        <p>已登录用户的报价表单将在这里显示</p>
                    </div>
                </div>
            );
        }
        
        // 添加旋转动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
        
        // 渲染组件
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <div>
                <h1 style={{textAlign: 'center', marginBottom: '30px'}}>QuoteCreationFlow 组件测试</h1>
                <QuoteCreationFlow language="zh" />
            </div>
        );
    </script>
</body>
</html>
